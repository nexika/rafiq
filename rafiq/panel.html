<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafiq</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f1e; --muted: #6b706d; --line: #e3e2dc;
  --accent: #0f766e; --accent-soft: #ccebe7; --warn: #b45309; --warn-soft: #fdecc8; --err: #b91c1c;
  --you: #e9efe9; --rafiq: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111413; --panel: #191d1c; --ink: #e8ebe9; --muted: #9aa29e; --line: #2a302e;
    --accent: #2dd4bf; --accent-soft: #123b37; --warn: #fbbf24; --warn-soft: #3b2f12; --err: #f87171;
    --you: #1f2a27; --rafiq: #191d1c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 140px; }
header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.orb { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); flex: none;
  position: relative; transition: background .3s; }
.orb::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--accent);
  opacity: .5; transition: transform .3s, opacity .3s; }
.orb[data-state="listening"]::after { opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
.orb[data-state="thinking"]::after { opacity: .9; animation: spin 1s linear infinite; border-radius: 30%; }
.orb[data-state="speaking"]::after { opacity: 1; animation: talk .5s ease-in-out infinite alternate; }
.orb[data-state="offline"], .orb[data-state="muted"] { background: var(--line); }
.orb[data-state="offline"]::after, .orb[data-state="muted"]::after { background: var(--muted); }
#mute[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); }
@keyframes pulse { 50% { transform: scale(1.35); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes talk { to { transform: scaleY(1.4); } }
@media (prefers-reduced-motion: reduce) { .orb::after { animation: none !important; } }
h1 { font-size: 22px; margin: 0; letter-spacing: .01em; }
h1 span { color: var(--muted); font-weight: 400; }
#state { color: var(--muted); font-size: 14px; }
header label { margin-left: auto; font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 6px 8px; }
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#log { display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; border: 1px solid var(--line);
  white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { background: var(--you); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.rafiq { background: var(--rafiq); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg .meta { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.note { font-size: 13px; color: var(--muted); align-self: center; text-align: center; max-width: 95%; }
.note.err { color: var(--err); }
.tool { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); align-self: flex-start;
  border-left: 3px solid var(--accent-soft); padding: 2px 10px; max-width: 95%; overflow-wrap: anywhere; }
#confirm { display: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px;
  width: min(728px, calc(100% - 32px)); background: var(--warn-soft); color: var(--ink);
  border: 1px solid var(--warn); border-radius: 14px; padding: 12px 14px; gap: 10px; align-items: center; }
#confirm.on { display: flex; }
#confirm p { margin: 0; flex: 1; }
footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--line); }
footer form { max-width: 760px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 8px; }
input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); padding: 10px 14px; cursor: pointer; white-space: nowrap; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.navlink { color: var(--accent); font-size: 14px; }
#mode { margin-left: auto; font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
#mode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { color: var(--muted); text-align: center; margin-top: 48px; }
header .grow { flex: 1; min-width: 0; }
#meter { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
#meter div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
#now { font-size: 13px; color: var(--muted); min-height: 1.5em; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel);
  border-left: 1px solid var(--line); padding: 20px 16px; overflow-y: auto; transform: translateX(100%);
  transition: transform .2s; z-index: 10; }
#drawer.on { transform: none; }
@media (prefers-reduced-motion: reduce) { #drawer { transition: none; } }
#drawer h2 { font-size: 18px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
#drawer h3 { font-size: 14px; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
#drawer label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
#drawer select, #drawer input { width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#drawer .row { display: flex; gap: 8px; align-items: center; }
#drawer .row select { flex: 1; }
#drawer ul { margin: 0; padding-left: 18px; font-size: 14px; }
#saved { font-size: 13px; color: var(--muted); min-height: 1.5em; margin-top: 8px; }
#picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: -8px 0 20px; font-size: 14px; }
#picker select { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); max-width: 100%; }
#picker button { padding: 6px 12px; }
#picker-note { color: var(--muted); }
#picker-note.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <header>
    <div class="orb" id="orb" data-state="offline" aria-hidden="true"></div>
    <div class="grow">
      <h1>Rafiq <span>رفيق</span></h1>
      <div id="state" role="status">connecting…</div>
      <div id="meter" title="Microphone level" aria-hidden="true"><div></div></div>
      <div id="now"></div>
    </div>
    <button type="button" id="open-settings" title="Settings" aria-controls="drawer" aria-expanded="false">⚙</button>
    <select id="mode" aria-label="Mode" title="Everyday: fast. Quality: the strongest model. Offline: nothing leaves this computer.">
      <option value="everyday">Everyday</option>
      <option value="quality">Quality</option>
      <option value="offline">Offline</option>
    </select>
    <label>Style
      <select id="persona">
        <option value="neutral">Neutral</option>
        <option value="concise">Concise</option>
        <option value="butler">Witty butler</option>
      </select>
    </label>
    <a href="/subscriptions" class="navlink">Subscriptions</a>
  </header>
  <div id="picker">
    <label for="backend">Brain</label>
    <select id="backend">
      <option value="auto">Auto</option><option value="claude">Claude</option>
      <option value="openai">OpenAI</option><option value="ollama">Ollama</option>
    </select>
    <select id="model" aria-label="Model" hidden></select>
    <button type="button" id="use" hidden>Use</button>
    <span id="picker-note" role="status"></span>
  </div>
  <div id="log" aria-live="polite">
    <p class="empty" id="empty">Say “Rafiq”, press Talk, or type below.<br>English · Français · Español · Deutsch · العربية · مصري</p>
  </div>
</main>
<div id="confirm" role="alertdialog" aria-labelledby="confirm-text">
  <p id="confirm-text"></p>
  <button class="primary" id="yes">Yes</button>
  <button id="no">No</button>
</div>
<aside id="drawer" aria-label="Settings" hidden>
  <h2>Settings <button type="button" id="close-settings" title="Close">✕</button></h2>
  <label for="s-mode">Brain</label>
  <select id="s-mode" data-name="brain.mode"></select>
  <label for="s-claude">Claude model</label>
  <input id="s-claude" data-name="brain.claude_model" autocomplete="off">
  <label for="s-ollama">Ollama model</label>
  <input id="s-ollama" data-name="brain.ollama_model" autocomplete="off">
  <label for="s-engine">Voice engine</label>
  <select id="s-engine" data-name="voice.engine"></select>
  <label for="s-rate">Speed (for example +10% or -10%)</label>
  <input id="s-rate" data-name="voice.rate" autocomplete="off">
  <label for="s-tag">Voice for</label>
  <div class="row">
    <select id="s-tag"></select>
    <button type="button" id="test-voice" title="Say a line in this voice">▶ Test</button>
  </div>
  <input id="s-voice" aria-label="Voice name" autocomplete="off">
  <button type="button" class="primary" id="save" style="margin-top:14px">Save</button>
  <div id="saved" role="status"></div>
  <h3>Spend since Rafiq started</h3>
  <div id="spend">–</div>
  <h3>Timers and reminders</h3>
  <ul id="tasks"></ul>
</aside>
<footer>
  <form id="form">
    <button type="button" class="primary" id="talk" title="Speak without saying the name">🎙 Talk</button>
    <input type="text" id="text" placeholder="Type to Rafiq…" autocomplete="off" dir="auto" aria-label="Message">
    <button type="submit">Send</button>
    <button type="button" id="stop" title="Stop speaking">■</button>
    <button type="button" id="mute" aria-pressed="false" title="Stop listening (rafiq mute)">Mute</button>
  </form>
</footer>
<script>
const TOKEN = "__TOKEN__";
const STATES = { idle: "Waiting for “Rafiq”", listening: "Listening…", thinking: "Thinking…",
  speaking: "Speaking", muted: "Muted: not listening for “Rafiq”", starting: "Starting…",
  calibrating: "Listening to the room, a moment of quiet…", offline: "Not connected: is Rafiq running?" };
const log = document.getElementById("log"), orb = document.getElementById("orb");
const stateEl = document.getElementById("state"), confirmBox = document.getElementById("confirm");
const modeEl = document.getElementById("mode");

function add(cls, text, meta) {
  document.getElementById("empty")?.remove();
  const el = document.createElement("div");
  el.className = cls;
  el.dir = "auto";
  if (meta) { const m = document.createElement("span"); m.className = "meta"; m.textContent = meta; el.append(m); }
  el.append(document.createTextNode(text));
  log.append(el);
  el.scrollIntoView({ block: "end", behavior: "smooth" });
}
const muteBtn = document.getElementById("mute");
function setState(s) {
  orb.dataset.state = s; stateEl.textContent = STATES[s] || s;
  if (s === "muted" || s === "idle") {
    muteBtn.setAttribute("aria-pressed", String(s === "muted"));
    muteBtn.textContent = s === "muted" ? "Unmute" : "Mute";
  }
}
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Rafiq-Token": TOKEN },
    body: JSON.stringify(body || {}) });
  if (!r.ok) add("note err", "The panel could not reach Rafiq (" + r.status + ").");
}
const LANG = { en: "English", fr: "Français", es: "Español", de: "Deutsch", ar: "العربية", "ar-EG": "مصري" };

function handle(e) {
  switch (e.kind) {
    case "state": setState(e.state); break;
    case "heard": add("msg you", e.text || "…", "You · " + (LANG[e.tag] || e.tag)); break;
    case "typed": add("msg you", e.text, "You (typed)"); break;
    case "said": add("msg rafiq", e.text, "Rafiq · " + (LANG[e.tag] || e.tag)); break;
    case "tool": nowEl.textContent = ""; add("tool", "⚙ " + e.name + " " + JSON.stringify(e.args) + "\n→ " + e.result); break;
    case "persona": document.getElementById("persona").value = e.persona; break;
    case "brain": stateEl.dataset.backend = e.backend; break;
    case "scene": add("tool", "▶ scene " + e.id + "\n" + e.steps.map(s => s[0] + " → " + s[1]).join("\n")); break;
    case "task": add(e.state === "failed" ? "note err" : "note", "Background task “" + e.goal + "”: " + e.state
      + (e.state === "running" ? "" : " (" + (e.cost == null ? "cost unknown" : "$" + e.cost.toFixed(4)) + ")\n"
      + e.result)); break;
    case "calibrated": add("note", "Listened to the room: speech above " + e.threshold + ", "
      + e.end_seconds + " s of silence ends a request (microphone at " + e.rate + " Hz)"); break;
    case "mode": modeEl.value = e.mode; break;
    case "wake": if (e.score !== undefined) add("note", "Heard the name (match " + e.score + ", wakes below "
      + e.threshold + ")"); break;
    case "confirm": document.getElementById("confirm-text").textContent = "Rafiq asks: " + e.action + "?";
      confirmBox.classList.add("on"); document.getElementById("yes").focus(); break;
    case "interrupted": add("note", "Stopped: you said stop"); break;
    case "confirmed": confirmBox.classList.remove("on"); break;
    case "level": meter.style.width = Math.round(e.level * 100) + "%"; break;
    case "tool_start": nowEl.textContent = "⚙ Using " + e.name + "…"; break;
    case "spend": showSpend(e); break;
    case "settings": settings = e.settings; fillDrawer(); break;
    case "muted": add("note", e.muted ? "Muted" : "Listening again");
      muteBtn.setAttribute("aria-pressed", String(e.muted)); muteBtn.textContent = e.muted ? "Unmute" : "Mute"; break;
    case "sleep": add("note", "Gone to sleep: say “Rafiq” to wake it"); break;
    case "error": add("note err", "Problem: " + (e.error || JSON.stringify(e.brain))); break;
  }
}
function connect() {
  const es = new EventSource("/events?token=" + encodeURIComponent(TOKEN));
  es.onmessage = (m) => handle(JSON.parse(m.data));
  es.onerror = () => { setState("offline"); es.close(); setTimeout(connect, 3000); };
}
document.getElementById("form").onsubmit = (ev) => {
  ev.preventDefault();
  const input = document.getElementById("text"), text = input.value.trim();
  if (text) { post("/api/text", { text }); input.value = ""; }
};
document.getElementById("talk").onclick = () => post("/api/listen");
modeEl.onchange = () => post("/api/mode", { mode: modeEl.value });
document.getElementById("persona").onchange = (ev) => post("/api/persona", { name: ev.target.value });
document.getElementById("stop").onclick = () => post("/api/stop");
muteBtn.onclick = () => post("/api/mute", { muted: muteBtn.getAttribute("aria-pressed") !== "true" });
document.getElementById("yes").onclick = () => post("/api/confirm", { yes: true });
document.getElementById("no").onclick = () => post("/api/confirm", { yes: false });

// ---------------------------------------------------------------- the settings drawer
const drawer = document.getElementById("drawer"), meter = document.querySelector("#meter div");
const nowEl = document.getElementById("now"), savedEl = document.getElementById("saved");
const voiceTag = document.getElementById("s-tag"), voiceName = document.getElementById("s-voice");
let settings = {}, voiceEdits = {};
for (const [tag, name] of Object.entries(LANG)) voiceTag.append(new Option(name, tag));

function showSpend(s) {
  const tokens = s.input_tokens.toLocaleString() + " in · " + s.output_tokens.toLocaleString() + " out (Claude tokens)";
  document.getElementById("spend").textContent = s.dollars === null ? tokens + "; set brain.prices for dollars"
    : "$" + s.dollars.toFixed(4) + " · " + tokens;
}
function fillDrawer() {
  for (const el of drawer.querySelectorAll("[data-name]")) el.value = settings[el.dataset.name] ?? "";
  voiceEdits = {};
  voiceName.value = settings["voice.voices." + voiceTag.value] ?? "";
}
async function openDrawer() {
  const r = await fetch("/api/status", { headers: { "X-Rafiq-Token": TOKEN } });
  if (!r.ok) return add("note err", "The panel could not reach Rafiq (" + r.status + ").");
  const s = await r.json();
  settings = s.settings;
  for (const [name, options] of Object.entries(s.choices)) {
    const el = drawer.querySelector('[data-name="' + name + '"]');
    el.replaceChildren(...options.map((o) => new Option(o, o)));
  }
  fillDrawer();
  showSpend(s.spend);
  document.getElementById("tasks").replaceChildren(...(s.tasks.length ? s.tasks : [null]).map((t) => {
    const li = document.createElement("li");
    li.textContent = t ? t.label + " · " + new Date(t.due * 1000).toLocaleString() : "None waiting";
    return li;
  }));
  savedEl.textContent = "";
  drawer.hidden = false;
  requestAnimationFrame(() => drawer.classList.add("on"));
  document.getElementById("open-settings").setAttribute("aria-expanded", "true");
  document.getElementById("s-mode").focus();
}
function closeDrawer() {
  drawer.classList.remove("on");
  setTimeout(() => { drawer.hidden = true; }, 200);
  document.getElementById("open-settings").setAttribute("aria-expanded", "false");
  document.getElementById("open-settings").focus();
}
voiceTag.onchange = () => { voiceName.value = voiceEdits[voiceTag.value] ?? settings["voice.voices." + voiceTag.value] ?? ""; };
voiceName.oninput = () => { voiceEdits[voiceTag.value] = voiceName.value.trim(); };
document.getElementById("open-settings").onclick = () => drawer.hidden ? openDrawer() : closeDrawer();
document.getElementById("close-settings").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !drawer.hidden) closeDrawer(); });
document.getElementById("test-voice").onclick = () => post("/api/voice-test", { tag: voiceTag.value });
document.getElementById("save").onclick = async () => {
  const changes = {};
  for (const el of drawer.querySelectorAll("[data-name]")) {
    const v = el.value.trim();
    if (v !== String(settings[el.dataset.name] ?? "")) changes[el.dataset.name] = v;
  }
  for (const [tag, v] of Object.entries(voiceEdits))
    if (v !== (settings["voice.voices." + tag] ?? "")) changes["voice.voices." + tag] = v;
  if (!Object.keys(changes).length) { savedEl.textContent = "Nothing changed."; return; }
  const r = await fetch("/api/settings", { method: "POST", body: JSON.stringify({ changes }),
    headers: { "Content-Type": "application/json", "X-Rafiq-Token": TOKEN } });
  const body = await r.json().catch(() => ({}));
  savedEl.textContent = r.ok ? "Saved to config.toml." : "Not saved: " + (body.error || r.status);
};
// The model picker: the list comes from the provider itself, and Rafiq asks it again before switching.
const backendEl = document.getElementById("backend"), modelEl = document.getElementById("model");
const useEl = document.getElementById("use"), pickerNote = document.getElementById("picker-note");
let brain = null;
async function ask(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Rafiq-Token": TOKEN },
    body: JSON.stringify(body || {}) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "error " + r.status);
  return data;
}
function note(text, err) { pickerNote.textContent = text; pickerNote.className = err ? "err" : ""; }
async function loadBrain() {
  try { brain = await ask("/api/brain"); } catch (e) { return note(e.message, true); }
  backendEl.value = brain.mode;
  note(brain.mode === "auto" ? "Claude, then OpenAI, then Ollama" : brain.models[brain.mode]);
}
backendEl.onchange = async () => {
  const backend = backendEl.value;
  modelEl.hidden = useEl.hidden = true;
  if (backend === "auto") { useEl.hidden = false; return note("Claude, then OpenAI, then Ollama"); }
  note("Asking " + backend + " which models this key can use…");
  try {
    const { models } = await ask("/api/models", { backend });
    modelEl.replaceChildren(...models.map((m) => new Option(m, m, false, brain && m === brain.models[backend])));
    modelEl.hidden = useEl.hidden = !models.length;
    note(models.length ? "" : "No models available.", !models.length);
  } catch (e) { note(e.message, true); }
};
useEl.onclick = async () => {
  note("Checking…");
  try { await ask("/api/model", { backend: backendEl.value, model: modelEl.value || "" }); }
  catch (e) { return note(e.message, true); }
  modelEl.hidden = useEl.hidden = true;
  loadBrain();
};
loadBrain();
connect();
</script>
</body>
</html>
