<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafiq</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f1e; --muted: #6b706d; --line: #e3e2dc;
  --accent: #0f766e; --accent-soft: #ccebe7; --warn: #b45309; --warn-soft: #fdecc8; --err: #b91c1c;
  --you: #e9efe9; --rafiq: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111413; --panel: #191d1c; --ink: #e8ebe9; --muted: #9aa29e; --line: #2a302e;
    --accent: #2dd4bf; --accent-soft: #123b37; --warn: #fbbf24; --warn-soft: #3b2f12; --err: #f87171;
    --you: #1f2a27; --rafiq: #191d1c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 140px; }
header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.orb { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); flex: none;
  position: relative; transition: background .3s; }
.orb::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--accent);
  opacity: .5; transition: transform .3s, opacity .3s; }
.orb[data-state="listening"]::after { opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
.orb[data-state="thinking"]::after { opacity: .9; animation: spin 1s linear infinite; border-radius: 30%; }
.orb[data-state="speaking"]::after { opacity: 1; animation: talk .5s ease-in-out infinite alternate; }
.orb[data-state="offline"] { background: var(--line); }
.orb[data-state="offline"]::after { background: var(--muted); }
@keyframes pulse { 50% { transform: scale(1.35); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes talk { to { transform: scaleY(1.4); } }
@media (prefers-reduced-motion: reduce) { .orb::after { animation: none !important; } }
h1 { font-size: 22px; margin: 0; letter-spacing: .01em; }
h1 span { color: var(--muted); font-weight: 400; }
#state { color: var(--muted); font-size: 14px; }
#log { display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; border: 1px solid var(--line);
  white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { background: var(--you); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.rafiq { background: var(--rafiq); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg .meta { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.note { font-size: 13px; color: var(--muted); align-self: center; text-align: center; max-width: 95%; }
.note.err { color: var(--err); }
.tool { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); align-self: flex-start;
  border-left: 3px solid var(--accent-soft); padding: 2px 10px; max-width: 95%; overflow-wrap: anywhere; }
#confirm { display: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px;
  width: min(728px, calc(100% - 32px)); background: var(--warn-soft); color: var(--ink);
  border: 1px solid var(--warn); border-radius: 14px; padding: 12px 14px; gap: 10px; align-items: center; }
#confirm.on { display: flex; }
#confirm p { margin: 0; flex: 1; }
footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--line); }
footer form { max-width: 760px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 8px; }
input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); padding: 10px 14px; cursor: pointer; white-space: nowrap; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { color: var(--muted); text-align: center; margin-top: 48px; }
header .grow { flex: 1; min-width: 0; }
#privacy { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap; }
#privacy[data-offline="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
#privacy[data-offline="false"] { background: var(--warn-soft); border-color: var(--warn); color: var(--ink); }
#history[hidden], #log[hidden] { display: none; }
#history .bar { display: flex; gap: 8px; margin-bottom: 14px; }
#history ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
#history li { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
  display: flex; gap: 10px; align-items: flex-start; }
#history li div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#history li .meta { display: block; font-size: 12px; color: var(--muted); }
#history li p { margin: 2px 0; }
#history li .said { color: var(--muted); }
button.danger { color: var(--err); }
@media (max-width: 520px) { header { flex-wrap: wrap; } #privacy { order: 3; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="orb" id="orb" data-state="offline" aria-hidden="true"></div>
    <div class="grow">
      <h1>Rafiq <span>رفيق</span></h1>
      <div id="state" role="status">connecting…</div>
    </div>
    <span id="privacy" title="What leaves this computer">…</span>
    <button type="button" id="show-history" aria-pressed="false">History</button>
  </header>
  <section id="history" hidden aria-label="What Rafiq heard">
    <div class="bar">
      <input type="text" id="search" placeholder="Search what you said or Rafiq answered…" dir="auto"
        autocomplete="off" aria-label="Search the history">
      <button type="button" class="danger" id="clear-history">Delete all</button>
    </div>
    <ul id="entries"></ul>
    <p class="empty" id="no-entries" hidden>Nothing kept. Only what you say after “Rafiq” or type here is
      kept, on this computer, for a few days.</p>
  </section>
  <div id="log" aria-live="polite">
    <p class="empty" id="empty">Say “Rafiq”, press Talk, or type below.<br>English · Français · Español · Deutsch · العربية · مصري</p>
  </div>
</main>
<div id="confirm" role="alertdialog" aria-labelledby="confirm-text">
  <p id="confirm-text"></p>
  <button class="primary" id="yes">Yes</button>
  <button id="no">No</button>
</div>
<footer>
  <form id="form">
    <button type="button" class="primary" id="talk" title="Speak without saying the name">🎙 Talk</button>
    <input type="text" id="text" placeholder="Type to Rafiq…" autocomplete="off" dir="auto" aria-label="Message">
    <button type="submit">Send</button>
    <button type="button" id="stop" title="Stop speaking">■</button>
  </form>
</footer>
<script>
const TOKEN = "__TOKEN__";
const STATES = { idle: "Waiting for “Rafiq”", listening: "Listening…", thinking: "Thinking…",
  speaking: "Speaking", starting: "Starting…", offline: "Not connected: is Rafiq running?" };
const log = document.getElementById("log"), orb = document.getElementById("orb");
const stateEl = document.getElementById("state"), confirmBox = document.getElementById("confirm");

function add(cls, text, meta) {
  document.getElementById("empty")?.remove();
  const el = document.createElement("div");
  el.className = cls;
  el.dir = "auto";
  el.dataset.text = text;
  if (meta) { const m = document.createElement("span"); m.className = "meta"; m.textContent = meta; el.append(m); }
  el.append(document.createTextNode(text));
  log.append(el);
  el.scrollIntoView({ block: "end", behavior: "smooth" });
}
function setState(s) { orb.dataset.state = s; stateEl.textContent = STATES[s] || s; }
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Rafiq-Token": TOKEN },
    body: JSON.stringify(body || {}) });
  if (!r.ok) add("note err", "The panel could not reach Rafiq (" + r.status + ").");
}
const LANG = { en: "English", fr: "Français", es: "Español", de: "Deutsch", ar: "العربية", "ar-EG": "مصري" };

function handle(e) {
  switch (e.kind) {
    case "state": setState(e.state); break;
    case "heard": add("msg you", e.text || "…", "You · " + (LANG[e.tag] || e.tag)); break;
    case "typed": add("msg you", e.text, "You (typed)"); break;
    case "said": add("msg rafiq", e.text, "Rafiq · " + (LANG[e.tag] || e.tag)); break;
    case "tool": add("tool", "⚙ " + e.name + " " + JSON.stringify(e.args) + "\n→ " + e.result); break;
    case "brain": stateEl.dataset.backend = e.backend; break;
    case "wake": if (e.score !== undefined) add("note", "Heard the name (match " + e.score + ", wakes below "
      + e.threshold + ")"); break;
    case "confirm": document.getElementById("confirm-text").textContent = "Rafiq asks: " + e.action + "?";
      confirmBox.classList.add("on"); document.getElementById("yes").focus(); break;
    case "confirmed": confirmBox.classList.remove("on"); break;
    case "error": add("note err", "Problem: " + (e.error || JSON.stringify(e.brain))); break;
    case "privacy": showPrivacy(e); break;
    case "forgotten":
      for (const el of [...log.querySelectorAll(".msg")]) if (e.texts.includes(el.dataset.text)) el.remove();
      if (!historyBox.hidden) loadHistory(); break;
  }
}
const NAMES = { claude: "Claude", ollama: "Ollama", azure: "Azure voice", edge: "Edge voice", piper: "Piper" };
const named = (c) => NAMES[c] || c;
function showPrivacy(p) {
  const badge = document.getElementById("privacy");
  badge.dataset.offline = p.offline;
  badge.textContent = p.offline ? "Offline: nothing leaves this computer" : "Online: " + p.cloud.map(named).join(", ");
  badge.title = "Thinking: " + named(p.brain) + " · Voice: " + named(p.voice)
    + (p.offline ? "" : "\nRequests are sent to: " + p.cloud.map(named).join(", "));
}

// ---- history: what Rafiq heard and answered, kept on this computer
const historyBox = document.getElementById("history"), entriesEl = document.getElementById("entries");
async function loadHistory() {
  const q = document.getElementById("search").value;
  const r = await fetch("/api/history?token=" + encodeURIComponent(TOKEN) + "&q=" + encodeURIComponent(q));
  if (!r.ok) return add("note err", "The panel could not read the history (" + r.status + ").");
  const data = await r.json();
  showPrivacy(data.privacy);
  entriesEl.replaceChildren(...data.entries.map(entryEl));
  document.getElementById("no-entries").hidden = data.entries.length > 0;
}
function entryEl(e) {
  const li = document.createElement("li"), body = document.createElement("div");
  const meta = document.createElement("span"), heard = document.createElement("p"), said = document.createElement("p");
  meta.className = "meta";
  meta.textContent = new Date(e.time * 1000).toLocaleString() + " · " + (e.source === "typed" ? "typed" : "said")
    + " · " + (LANG[e.tag] || e.tag);
  heard.textContent = e.heard; heard.dir = "auto";
  said.textContent = e.said; said.dir = "auto"; said.className = "said";
  body.append(meta, heard, said);
  const del = document.createElement("button");
  del.type = "button"; del.textContent = "Delete"; del.className = "danger";
  del.setAttribute("aria-label", "Delete: " + e.heard);
  del.onclick = async () => { await post("/api/history/delete", { id: e.id }); loadHistory(); };
  li.append(body, del);
  return li;
}
document.getElementById("show-history").onclick = (ev) => {
  const open = historyBox.hidden;
  historyBox.hidden = !open; log.hidden = open;
  ev.currentTarget.setAttribute("aria-pressed", open);
  ev.currentTarget.textContent = open ? "Conversation" : "History";
  if (open) loadHistory();
};
let searchTimer;
document.getElementById("search").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadHistory, 250); };
document.getElementById("clear-history").onclick = async () => {
  if (!confirm("Delete everything Rafiq kept of what you said?")) return;
  await post("/api/history/clear"); loadHistory();
};
function connect() {
  const es = new EventSource("/events?token=" + encodeURIComponent(TOKEN));
  es.onmessage = (m) => handle(JSON.parse(m.data));
  es.onerror = () => { setState("offline"); es.close(); setTimeout(connect, 3000); };
}
document.getElementById("form").onsubmit = (ev) => {
  ev.preventDefault();
  const input = document.getElementById("text"), text = input.value.trim();
  if (text) { post("/api/text", { text }); input.value = ""; }
};
document.getElementById("talk").onclick = () => post("/api/listen");
document.getElementById("stop").onclick = () => post("/api/stop");
document.getElementById("yes").onclick = () => post("/api/confirm", { yes: true });
document.getElementById("no").onclick = () => post("/api/confirm", { yes: false });
connect();
</script>
</body>
</html>
