name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # The test that speaks with a Piper voice skips here: it needs voice and model files that are
      # downloaded on a user's machine, not committed.
      - name: Test
        run: python -m pytest -q

  ci-passed:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ]
