name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # The test that speaks with a Piper voice skips here: it needs voice and model files that are
      # downloaded on a user's machine, not committed.
      - name: Test
        run: python -m pytest -q

  # The widget (widget/): the page's logic with Node's own test runner, and the Tauri side with cargo.
  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the page
        run: node --test
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential
      - name: Test the app
        working-directory: widget/src-tauri
        run: cargo test --locked

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, widget]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ] \
            && [ "${{ needs.widget.result }}" = success ]
