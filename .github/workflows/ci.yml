name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # The test that speaks with a Piper voice skips here: it needs voice and model files that are
      # downloaded on a user's machine, not committed.
      - name: Test
        run: python -m pytest -q -n auto      # in parallel on the runner's cores (pytest-xdist)

  # Whether a pull request (or the merge queue) touches what differs on macOS; on main macOS always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE" ]; then echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The platform layer and everything that calls it, the installer, the dependencies and the test setup.
          pattern='^(rafiq/(desktop|audio|service|hosting|presence|dictation|gestures|reader|tts|panel|sock|mobile|doctor|__main__)\.py|rafiq/tools/(__init__|pc|clipboard|screen|web|songs|reading)\.py|rafiq/video\.py|install\.sh|pyproject\.toml|tests/(conftest|test_macos|test_sock|test_mobile_socket)\.py|\.github/workflows/ci\.yml)$'
          if git diff --name-only "$BASE" HEAD | grep -Eq "$pattern"; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  # macOS (#192): the install script on a clean Mac, the suite (every device is faked), and what doctor says there.
  test-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
      # The installed .venv, kept while the dependencies and the installer stay the same (about 70 s each run).
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'install.sh') }}
      - name: Install with install.sh
        run: PYTHON=python3.13 ./install.sh --no-setup
      - name: Test
        run: |
          .venv/bin/python -m pip install --quiet -e ".[dev]"
          .venv/bin/python -m pytest -q -n auto
      - name: Doctor
        run: .venv/bin/rafiq doctor || true     # no microphone or desktop on the runner: for the log only

  # The widget (widget/): the page's logic with Node's own test runner, and the Tauri side with cargo.
  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the page
        run: node --test
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential
      - name: Test the app
        working-directory: widget/src-tauri
        run: cargo test --locked

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, changes, test-macos, widget]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ] \
            && [ "${{ needs.changes.result }}" = success ] && [ "${{ needs.widget.result }}" = success ] \
            && { [ "${{ needs.test-macos.result }}" = success ] || [ "${{ needs.test-macos.result }}" = skipped ]; }
