[project]
name = "rafiq"
version = "0.1.0"
description = "Rafiq (رفيق): a voice assistant that speaks English, French, Spanish, German, Arabic and Egyptian Arabic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "sounddevice>=0.4",
    "faster-whisper>=1.1",
    "onnxruntime>=1.17",
    "edge-tts>=6.1",
    "psutil>=5.9",
    "trafilatura>=1.8",
    "ddgs>=9.0",
]

[project.optional-dependencies]
google = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
offline-voice = ["piper-tts>=1.2"]
obs = ["obsws-python>=1.6"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rafiq = "rafiq.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rafiq*"]

[tool.setuptools.package-data]
rafiq = ["panel.html"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
